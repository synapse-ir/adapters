name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - name: Check out adapters repo
        uses: actions/checkout@v4
        with:
          path: adapters

      - name: Check out adapter-sdk repo
        uses: actions/checkout@v4
        with:
          repository: synapse-ir/adapter-sdk
          path: adapter-sdk

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - name: Install dependencies
        working-directory: adapters
        run: uv sync --all-extras

      - name: Run tests
        working-directory: adapters
        run: uv run pytest --tb=short -q

      - name: Ruff lint
        working-directory: adapters
        run: uv run ruff check .

      - name: Mypy type check
        working-directory: adapters
        run: |
          uv run mypy $(find . -name "*_adapter.py" -not -path "./.venv/*" | sort)

      - name: Validate all adapters
        working-directory: adapters
        run: |
          for adapter_file in $(find . -name "*_adapter.py" -not -path "./.venv/*" | sort); do
            folder=$(dirname "$adapter_file")
            module=$(basename "$adapter_file" .py)
            class_name=$(uv run python -c "
          import ast, sys
          tree = ast.parse(open('$adapter_file').read())
          classes = [n.name for n in ast.walk(tree) if isinstance(n, ast.ClassDef)]
          adapter_classes = [c for c in classes if c.endswith('Adapter')]
          print(adapter_classes[0] if adapter_classes else '')
          ")
            if [ -n "$class_name" ]; then
              echo "Validating $class_name from $module"
              uv run python -c "
          import sys
          sys.path.insert(0, '$folder')
          sys.path.insert(0, '.')
          from synapse_sdk.testing import AdapterValidator
          from $module import $class_name
          AdapterValidator($class_name()).assert_valid()
          print('  Validator: all rules passed')
          "
            fi
          done
