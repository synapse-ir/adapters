[project]
name = "synapse-community-adapters"
version = "0.1.0"
description = "Community SYNAPSE adapters"
requires-python = ">=3.11"
dependencies = [
    "numpy>=2.4.4",
    "synapse-adapter-sdk",
]

[tool.uv.sources]
synapse-adapter-sdk = { path = "../adapter-sdk", editable = true }

[tool.pytest.ini_options]
pythonpath = ["."]

[tool.mypy]
ignore_missing_imports = true

[dependency-groups]
dev = [
    "pytest>=9.0.3",
]
